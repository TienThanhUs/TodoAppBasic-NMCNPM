<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Nhiệm Vụ Kanban - Pixel Task Manager V3</title>
  <style>
    @font-face {
      font-family: 'MinecraftVN';
      src: url('/fonts/Pixelcraft.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* ---------- Màu nền ---------- */
      --bg-page:        #1b1b2f;   /* nền trang (xanh đêm đậm) */
      --bg-panel:       #2a2a45;   /* nền khung/panel */
      --bg-panel-light: #3a3a5c;   /* nền khung sáng hơn / hover */
      --bg-inset:       #121222;   /* ô trũng: input, thanh tiến độ */

      /* ---------- Chữ ---------- */
      --text:           #ffffff;
      --text-muted:     #a9a9c8;
      --text-on-accent: #1a1a1a;   /* chữ đặt trên nút màu sáng */

      /* ---------- Màu nhấn ---------- */
      --green-light: #8be36a;  --green: #4cb944;  --green-dark: #2b7a2b;   /* hoàn thành */
      --yellow-light:#ffe580;  --yellow:#ffc72c;  --yellow-dark:#b8860b;   /* điểm/XP/chưa xong */
      --blue-light:  #7ec8ff;  --blue:  #3a8fe0;  --blue-dark:  #1f548f;   /* thông tin */
      --red-light:   #ff8a80;  --red:   #e04646;  --red-dark:   #8f2020;   /* nguy hiểm/xoá */
      --gray-light:  #c9c9d6;  --gray:  #8e8ea5;  --gray-dark:  #55556b;   /* phụ */

      /* ---------- Viền & bóng ---------- */
      --outline:        #0b0b14;
      --border-w:       4px;
      --border-w-sm:    3px;
      --shadow-offset:  4px;

      /* ---------- Cỡ & khoảng cách ---------- */
      --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
      --space-4: 16px; --space-5: 24px; --space-6: 32px;

      /* ---------- Font Minecraft thuần 100% hỗ trợ tiếng Việt ---------- */
      --font-pixel: 'MinecraftVN', monospace;
      --font-body:  'MinecraftVN', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Thanh cuộn đồng bộ */
    ::-webkit-scrollbar { width: 16px; height: 16px; }
    ::-webkit-scrollbar-track { background: var(--bg-inset); border-left: var(--border-w) solid var(--outline); }
    ::-webkit-scrollbar-thumb { background: var(--gray); border: var(--border-w) solid var(--outline); }
    ::-webkit-scrollbar-thumb:hover { background: var(--gray-light); }

    body {
      background-color: var(--bg-page);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      padding: var(--space-5) var(--space-4);
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    img, svg, canvas, .sprite {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    /* Khung chuẩn .pixel-box */
    .pixel-box {
      background: var(--bg-panel);
      border: var(--border-w) solid var(--outline);
      border-radius: 0;
      box-shadow:
        inset calc(var(--border-w) * -1) calc(var(--border-w) * -1) 0 0 var(--bg-inset),
        inset var(--border-w) var(--border-w) 0 0 var(--bg-panel-light),
        var(--shadow-offset) var(--shadow-offset) 0 0 var(--outline);
    }

    /* Thanh tiêu đề panel */
    .panel-header {
      background: var(--bg-panel-light);
      border-bottom: var(--border-w) solid var(--outline);
      padding: var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }

    .panel-title {
      font-family: var(--font-pixel);
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .panel-body {
      padding: var(--space-5);
    }

    /* Huy hiệu / Nhãn (Badge) */
    .pixel-badge {
      font-family: var(--font-pixel);
      font-size: 14px;
      padding: var(--space-1) var(--space-3);
      border: var(--border-w-sm) solid var(--outline);
      border-radius: 0;
      background: var(--bg-inset);
      color: var(--yellow);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sync-status {
      font-family: var(--font-pixel);
      font-size: 12px;
      letter-spacing: 0.5px;
      color: var(--green-light);
    }

    .sync-status.is-offline {
      color: var(--red-light);
    }

    /* Form tạo task */
    .task-form {
      display: flex;
      gap: var(--space-3);
      align-items: flex-start;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .pixel-input {
      width: 100%;
      height: 48px;
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--text);
      background: var(--bg-inset);
      border: var(--border-w) solid var(--outline);
      border-radius: 0;
      padding: var(--space-2) var(--space-4);
      box-shadow:
        inset 4px 4px 0 0 var(--outline),
        inset -4px -4px 0 0 var(--bg-panel);
    }

    .pixel-input::placeholder {
      color: var(--text-muted);
    }

    .pixel-input:focus {
      outline: none;
      border-color: var(--yellow);
    }

    .pixel-input.is-error {
      border-color: var(--red);
    }

    .error-msg {
      color: var(--red-light);
      font-size: 14px;
      margin-top: var(--space-2);
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    /* Nút bấm chuẩn .pixel-btn */
    .pixel-btn {
      font-family: var(--font-pixel);
      font-size: 14px;
      letter-spacing: 1px;
      line-height: 1.2;
      padding: var(--space-3) var(--space-5);
      min-height: 48px;
      min-width: 48px;
      cursor: pointer;
      color: var(--text-on-accent);
      background: var(--green);
      border: var(--border-w) solid var(--outline);
      border-radius: 0;
      box-shadow:
        inset 0 4px 0 0 var(--green-light),
        inset 0 -4px 0 0 var(--green-dark),
        var(--shadow-offset) var(--shadow-offset) 0 0 var(--outline);
      text-transform: uppercase;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      white-space: nowrap;
    }

    .pixel-btn * {
      pointer-events: none;
    }

    .pixel-btn:hover {
      filter: brightness(1.1);
    }

    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow:
        inset 0 4px 0 0 var(--green-dark),
        inset 0 -4px 0 0 var(--green-light),
        2px 2px 0 0 var(--outline);
    }

    .pixel-btn:focus-visible {
      outline: 4px dashed var(--yellow);
      outline-offset: 4px;
    }

    /* Biến thể nút action Kanban */
    .pixel-btn--secondary {
      background: var(--gray);
      color: var(--text-on-accent);
      box-shadow:
        inset 0 4px 0 0 var(--gray-light),
        inset 0 -4px 0 0 var(--gray-dark),
        var(--shadow-offset) var(--shadow-offset) 0 0 var(--outline);
    }
    .pixel-btn--secondary:active {
      box-shadow:
        inset 0 4px 0 0 var(--gray-dark),
        inset 0 -4px 0 0 var(--gray-light),
        2px 2px 0 0 var(--outline);
    }

    .pixel-btn--accent {
      background: var(--yellow);
      color: var(--text-on-accent);
      box-shadow:
        inset 0 4px 0 0 var(--yellow-light),
        inset 0 -4px 0 0 var(--yellow-dark),
        var(--shadow-offset) var(--shadow-offset) 0 0 var(--outline);
    }
    .pixel-btn--accent:active {
      box-shadow:
        inset 0 4px 0 0 var(--yellow-dark),
        inset 0 -4px 0 0 var(--yellow-light),
        2px 2px 0 0 var(--outline);
    }

    .pixel-btn--danger {
      background: var(--red);
      color: var(--text);
      box-shadow:
        inset 0 4px 0 0 var(--red-light),
        inset 0 -4px 0 0 var(--red-dark),
        var(--shadow-offset) var(--shadow-offset) 0 0 var(--outline);
    }
    .pixel-btn--danger:active {
      box-shadow:
        inset 0 4px 0 0 var(--red-dark),
        inset 0 -4px 0 0 var(--red-light),
        2px 2px 0 0 var(--outline);
    }

    .status-btn {
      padding: var(--space-2) var(--space-3);
      font-size: 13px;
      min-height: 40px;
    }

    /* ========================================= */
    /* BẢNG KANBAN 2 CỘT: CHƯA XONG & HOÀN THÀNH */
    /* ========================================= */
    .kanban-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
      align-items: flex-start;
    }

    .kanban-column {
      background: var(--bg-panel);
      border: var(--border-w) solid var(--outline);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 0 var(--outline);
      display: flex;
      flex-direction: column;
    }

    .kanban-column-header {
      padding: var(--space-3) var(--space-4);
      border-bottom: var(--border-w) solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }

    .kanban-column-header.todo-header {
      background: var(--bg-panel-light);
      border-top: var(--border-w) solid var(--yellow);
    }

    .kanban-column-header.done-header {
      background: var(--bg-panel-light);
      border-top: var(--border-w) solid var(--green);
    }

    .kanban-column-title {
      font-family: var(--font-pixel);
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .column-badge {
      font-family: var(--font-pixel);
      font-size: 12px;
      padding: var(--space-1) var(--space-2);
      border: var(--border-w-sm) solid var(--outline);
      background: var(--bg-inset);
    }

    .column-badge.todo-badge { color: var(--yellow); }
    .column-badge.done-badge { color: var(--green-light); }

    .kanban-column-body {
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-height: 180px;
    }

    /* Thẻ nhiệm vụ (Kanban Card) */
    .task-card {
      background: var(--bg-inset);
      border: var(--border-w) solid var(--outline);
      padding: var(--space-3);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0 0 var(--outline);
    }

    .task-card.is-done {
      border-left: calc(var(--border-w) * 2) solid var(--green);
    }
    .task-card:not(.is-done) {
      border-left: calc(var(--border-w) * 2) solid var(--yellow);
    }

    .task-card-title {
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--text);
      word-break: break-word;
      line-height: 1.4;
    }

    .task-card.is-done .task-card-title {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .task-card-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
      border-top: var(--border-w-sm) solid var(--bg-panel);
      padding-top: var(--space-2);
    }

    .empty-column {
      text-align: center;
      padding: var(--space-5) var(--space-2);
      color: var(--text-muted);
      font-size: 14px;
      border: 2px dashed var(--gray-dark);
      margin: auto 0;
    }

    /* Con trỏ nhấp nháy kiểu pixel */
    @keyframes blink { 50% { opacity: 0; } }
    .cursor {
      display: inline-block;
      width: 12px;
      height: 20px;
      background: var(--green-light);
      vertical-align: middle;
      margin-left: var(--space-1);
      animation: blink 1s steps(1) infinite;
    }
    .cursor.is-offline { background: var(--red); }

    /* Responsive cho màn hình nhỏ / mobile */
    @media (max-width: 720px) {
      .kanban-board {
        grid-template-columns: 1fr;
      }
      .panel-title {
        font-size: 16px;
      }
      .task-form {
        flex-direction: column;
      }
      .pixel-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- Khu vực Tạo task mới -->
    <section class="pixel-box" aria-labelledby="create-heading">
      <header class="panel-header">
        <h1 id="create-heading" class="panel-title">
          <svg class="sprite" width="32" height="32" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="2" y="1" width="12" height="14" fill="var(--yellow)"/>
            <rect x="3" y="2" width="10" height="12" fill="var(--bg-inset)"/>
            <rect x="5" y="4" width="6" height="2" fill="var(--green-light)"/>
            <rect x="5" y="7" width="6" height="2" fill="var(--text)"/>
            <rect x="5" y="10" width="4" height="2" fill="var(--text-muted)"/>
          </svg>
          BẢNG KANBAN NHIỆM VỤ<span class="cursor" aria-hidden="true"></span>
        </h1>
        <span id="sync-status" class="sync-status" role="status">ĐANG KẾT NỐI...</span>
      </header>

      <div class="panel-body">
        <form id="task-form" class="task-form" novalidate onsubmit="event.preventDefault(); handleCreateTask();">
          <div class="input-wrapper">
            <label for="task-input" class="sr-only">Tên nhiệm vụ mới</label>
            <input
              type="text"
              id="task-input"
              class="pixel-input"
              placeholder="Nhập tên nhiệm vụ mới..."
              autocomplete="off"
              required
            >
            <p id="error-msg" class="error-msg" role="alert">Vui lòng nhập tên nhiệm vụ trước khi thêm!</p>
          </div>
          <button type="button" id="add-btn" class="pixel-btn" onclick="handleCreateTask()">
            <svg class="sprite" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="7" y="2" width="2" height="12" fill="var(--text-on-accent)"/>
              <rect x="2" y="7" width="12" height="2" fill="var(--text-on-accent)"/>
            </svg>
            THÊM MỚI
          </button>
        </form>
      </div>
    </section>

    <!-- Khu vực Bảng Kanban 2 cột -->
    <section class="kanban-board" aria-label="Bảng Kanban công việc">
      <!-- Cột 1: Chưa hoàn thành -->
      <article class="kanban-column" aria-labelledby="todo-col-heading">
        <header class="kanban-column-header todo-header">
          <h2 id="todo-col-heading" class="kanban-column-title">
            <span>⏳</span> CHƯA HOÀN THÀNH
          </h2>
          <span id="todo-count" class="column-badge todo-badge">0</span>
        </header>
        <div id="todo-list" class="kanban-column-body" aria-live="polite"></div>
      </article>

      <!-- Cột 2: Hoàn thành -->
      <article class="kanban-column" aria-labelledby="done-col-heading">
        <header class="kanban-column-header done-header">
          <h2 id="done-col-heading" class="kanban-column-title">
            <span>⚔️</span> HOÀN THÀNH
          </h2>
          <span id="done-count" class="column-badge done-badge">0</span>
        </header>
        <div id="done-list" class="kanban-column-body" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <script>
    const taskInput = document.getElementById('task-input');
    const errorMsg = document.getElementById('error-msg');
    const todoList = document.getElementById('todo-list');
    const doneList = document.getElementById('done-list');
    const todoCount = document.getElementById('todo-count');
    const doneCount = document.getElementById('done-count');
    const syncStatus = document.getElementById('sync-status');
    const cursorEl = document.querySelector('.cursor');

    const POLL_INTERVAL_MS = 2000;
    let lastSnapshot = null;

    const ICON_CHECK = `
      <svg class="sprite" width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="8" width="2" height="2" fill="var(--text-on-accent)"/>
        <rect x="4" y="10" width="2" height="2" fill="var(--text-on-accent)"/>
        <rect x="6" y="12" width="2" height="2" fill="var(--text-on-accent)"/>
        <rect x="8" y="8" width="2" height="4" fill="var(--text-on-accent)"/>
        <rect x="10" y="6" width="2" height="4" fill="var(--text-on-accent)"/>
        <rect x="12" y="4" width="2" height="4" fill="var(--text-on-accent)"/>
      </svg>
    `;

    const ICON_UNDO = `
      <svg class="sprite" width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="4" y="4" width="2" height="6" fill="var(--text-on-accent)"/>
        <rect x="2" y="6" width="2" height="2" fill="var(--text-on-accent)"/>
        <rect x="6" y="4" width="6" height="2" fill="var(--text-on-accent)"/>
        <rect x="12" y="6" width="2" height="6" fill="var(--text-on-accent)"/>
        <rect x="6" y="12" width="6" height="2" fill="var(--text-on-accent)"/>
      </svg>
    `;

    const ICON_TRASH = `
      <svg class="sprite" width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="5" y="2" width="6" height="2" fill="var(--text)"/>
        <rect x="2" y="4" width="12" height="2" fill="var(--text)"/>
        <rect x="4" y="6" width="2" height="8" fill="var(--text)"/>
        <rect x="7" y="6" width="2" height="8" fill="var(--text)"/>
        <rect x="10" y="6" width="2" height="8" fill="var(--text)"/>
        <rect x="4" y="12" width="8" height="2" fill="var(--text)"/>
      </svg>
    `;

    function setOnline(online) {
      syncStatus.classList.toggle('is-offline', !online);
      cursorEl && cursorEl.classList.toggle('is-offline', !online);
      syncStatus.textContent = online
        ? `ĐỒNG BỘ ${new Date().toLocaleTimeString('vi-VN')}`
        : 'MẤT KẾT NỐI SERVER';
    }

    // 1. Tải danh sách task
    async function fetchTasks() {
      try {
        const res = await fetch('/api/tasks', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const tasks = await res.json();
        const snapshot = JSON.stringify(tasks);
        if (snapshot !== lastSnapshot) {
          lastSnapshot = snapshot;
          renderKanban(tasks);
        }
        setOnline(true);
      } catch (err) {
        console.error('Lỗi nạp task:', err);
        setOnline(false);
      }
    }

    // Hiển thị dạng Kanban 2 cột
    function renderKanban(tasks) {
      todoList.innerHTML = '';
      doneList.innerHTML = '';

      const todoTasks = tasks.filter(t => !t.done);
      const doneTasks = tasks.filter(t => t.done);

      todoCount.textContent = `${todoTasks.length}`;
      doneCount.textContent = `${doneTasks.length}`;

      if (todoTasks.length === 0) {
        todoList.innerHTML = '<div class="empty-column">Không có việc cần làm!</div>';
      } else {
        todoTasks.forEach(task => todoList.appendChild(createTaskCard(task)));
      }

      if (doneTasks.length === 0) {
        doneList.innerHTML = '<div class="empty-column">Chưa hoàn thành việc nào!</div>';
      } else {
        doneTasks.forEach(task => doneList.appendChild(createTaskCard(task)));
      }
    }

    function createTaskCard(task) {
      const card = document.createElement('div');
      card.className = `task-card ${task.done ? 'is-done' : ''}`;

      const title = document.createElement('div');
      title.className = 'task-card-title';
      title.textContent = task.name;

      const actions = document.createElement('div');
      actions.className = 'task-card-actions';

      // Nút chuyển trạng thái Kanban: Chưa xong -> Xong (hoặc Xong -> Chưa xong)
      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = `pixel-btn status-btn ${task.done ? 'pixel-btn--secondary' : 'pixel-btn'}`;
      toggleBtn.innerHTML = `${task.done ? ICON_UNDO : ICON_CHECK} <span>${task.done ? 'CHƯA XONG' : 'XONG'}</span>`;
      toggleBtn.setAttribute('aria-label', `${task.done ? 'Chuyển về chưa hoàn thành' : 'Đánh dấu hoàn thành'} cho ${task.name}`);
      toggleBtn.onclick = () => setTaskDone(task.id, !task.done);

      // Nút xoá
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'pixel-btn status-btn pixel-btn--danger';
      deleteBtn.innerHTML = `${ICON_TRASH} <span>XOÁ</span>`;
      deleteBtn.setAttribute('aria-label', `Xoá nhiệm vụ ${task.name}`);
      deleteBtn.onclick = () => deleteTask(task.id);

      actions.appendChild(toggleBtn);
      actions.appendChild(deleteBtn);

      card.appendChild(title);
      card.appendChild(actions);

      return card;
    }

    // 2. Tạo task có tên
    async function handleCreateTask() {
      const name = taskInput.value.trim();

      if (!name) {
        taskInput.classList.add('is-error');
        errorMsg.classList.add('visible');
        taskInput.focus();
        return;
      }

      taskInput.classList.remove('is-error');
      errorMsg.classList.remove('visible');
      taskInput.value = '';

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });

        if (res.ok) {
          await fetchTasks();
        }
      } catch (err) {
        console.error('Lỗi tạo task:', err);
        setOnline(false);
      } finally {
        taskInput.focus();
      }
    }

    // 3. Đổi trạng thái task
    async function setTaskDone(id, done) {
      try {
        const res = await fetch(`/api/tasks/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ done })
        });
        if (res.status === 404) alert('Nhiệm vụ này đã bị xoá.');
      } catch (err) {
        setOnline(false);
      }
      await fetchTasks();
    }

    // 4. Xoá task
    async function deleteTask(id) {
      try {
        await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      } catch (err) {
        setOnline(false);
      }
      await fetchTasks();
    }

    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleCreateTask();
      }
    });

    taskInput.addEventListener('input', () => {
      if (taskInput.classList.contains('is-error')) {
        taskInput.classList.remove('is-error');
        errorMsg.classList.remove('visible');
      }
    });

    // Chu kỳ cập nhật Kanban đồng bộ
    fetchTasks();
    setInterval(fetchTasks, POLL_INTERVAL_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) fetchTasks();
    });
  </script>
</body>
</html>
